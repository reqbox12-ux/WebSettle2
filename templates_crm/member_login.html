<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>회원 로그인 — 라온스포츠</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/static/css/landing.css?v={{ asset_ver }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:18px;
      background:linear-gradient(135deg,#E60028,#1a1410); }
    .ml-card { width:min(420px,96vw); background:var(--surface,#fff); color:inherit;
      border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:30px 26px; }
    .ml-logo { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .ml-logo img { height:34px; object-fit:contain; }
    .ml-branch { display:inline-block; background:var(--accent,#E60028); color:#fff;
      font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; margin-bottom:10px; }
    .ml-card h1 { font-size:23px; font-weight:900; margin:0 0 4px; }
    .ml-sub { font-size:13px; opacity:.7; margin-bottom:18px; }
    .ml-field { margin-bottom:11px; }
    .ml-field label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
    .ml-field input { width:100%; padding:13px 14px; border:1.5px solid rgba(128,128,128,.3);
      border-radius:11px; font-size:14px; background:transparent; color:inherit; }
    .ml-btn { width:100%; height:50px; border:0; border-radius:12px; background:#E60028; color:#fff;
      font-size:15px; font-weight:800; cursor:pointer; margin-top:8px; }
    .ml-err { color:#E60028; font-size:12.5px; min-height:18px; margin:6px 0; }
    .ml-signup { text-align:center; margin-top:18px; font-size:13px; }
    .ml-signup a { color:var(--accent,#E60028); font-weight:700; }
    .ml-foot { text-align:center; font-size:11px; opacity:.5; margin-top:14px; }
  </style>
</head>
<body>
  <div class="ml-card">
    <div class="ml-logo">
      <img src="/static/img/logo.png" alt="LAONSPORTS">
    </div>
    {% if branch %}<div class="ml-branch">📍 {{ branch }}</div>{% endif %}
    <h1>회원 로그인</h1>
    <div class="ml-sub">전화번호로 로그인하고 수업·상품을 이용하세요</div>

    <form id="mlForm" onsubmit="memberLogin(event)">
      <div class="ml-field"><label>전화번호</label>
        <input id="ml-id" inputmode="numeric" placeholder="01012345678" autocomplete="username" required></div>
      <div class="ml-field"><label>비밀번호</label>
        <input id="ml-pw" type="password" placeholder="최초 1회: 전화번호 뒷 4자리" autocomplete="current-password" required></div>
      <label class="checkbox" style="font-size:13px"><input type="checkbox" id="ml-keep"> 로그인 유지</label>
      <div class="ml-err" id="ml-err"></div>
      <button class="ml-btn" type="submit" id="ml-btn">로그인</button>
    </form>

    <div class="ml-signup">
      아직 회원이 아니신가요?
      {% if token %}<a href="/signup?b={{ token }}">회원가입 신청 →</a>
      {% else %}<span style="opacity:.6">지점 QR로 접속해 가입하세요</span>{% endif %}
    </div>
    <div class="ml-foot">© 2026 LAONSPORTS</div>
  </div>

  <script>
    const TOKEN = "{{ token }}";
    async function memberLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('ml-btn'); const err = document.getElementById('ml-err');
      btn.disabled = true; btn.textContent = '로그인 중…'; err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ role:'member',
            identifier: document.getElementById('ml-id').value.trim(),
            password: document.getElementById('ml-pw').value })
        });
        const d = await r.json();
        if (!r.ok) { err.textContent = d.detail || '로그인 정보가 올바르지 않습니다.'; btn.disabled=false; btn.textContent='로그인'; return; }
        const keep = document.getElementById('ml-keep').checked;
        if (keep) localStorage.setItem('raon_token', d.token);
        else { sessionStorage.setItem('raon_token', d.token); localStorage.removeItem('raon_token'); }
        localStorage.setItem('raon_role', d.role);
        localStorage.setItem('raon_name', d.name);
        localStorage.setItem('raon_branch', d.branch || '');
        localStorage.setItem('raon_admin', '');
        localStorage.setItem('raon_roles', '[]');
        localStorage.setItem('raon_portal', 'member');   // 로그아웃 시 회원화면으로
        if (TOKEN) localStorage.setItem('raon_branch_token', TOKEN);
        location.href = '/home';
      } catch (e2) { err.textContent = '네트워크 오류가 발생했습니다.'; btn.disabled=false; btn.textContent='로그인'; }
    }
    // 이미 로그인돼 있으면 홈으로
    if (localStorage.getItem('raon_token') || sessionStorage.getItem('raon_token')) location.href='/home';
  </script>
</body>
</html>
